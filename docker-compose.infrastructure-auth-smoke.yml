services:
  api:
    environment:
      EAROS_ENV: development
      EAROS_ENABLE_DEV_LOGIN: "true"
      EAROS_ENABLE_BOOTSTRAP_ENDPOINT: "true"
      EAROS_BOOTSTRAP_SECRET: infrastructure-auth-smoke-only
      EAROS_DEFAULT_ORGANIZATION_ID: org_levelshift
      EAROS_COOKIE_SECURE: "false"
  web:
    build:
      args:
        VITE_BACKEND_URL: http://127.0.0.1:18080
        VITE_EAROS_ALLOW_INSECURE_LOCAL_SMOKE: "true"
    volumes:
      - ./frontend/nginx.infrastructure-auth-smoke.conf:/etc/nginx/conf.d/default.conf:ro
