services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      EAROS_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${EAROS_PUBLIC_API_ORIGIN:?Set EAROS_PUBLIC_API_ORIGIN to the public HTTPS API origin}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
