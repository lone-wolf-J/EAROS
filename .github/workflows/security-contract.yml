name: EAROS production security contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test tooling
        run: python -m pip install --upgrade pip pytest pytest-xdist
      - name: Compile production boundary modules
        run: python -m py_compile backend/server.py backend/applications/auth.py
      - name: Verify production security contract
        working-directory: backend
        run: pytest tests/test_production_security_contract.py -n 0
